site_name: 2026Spring Humanoid Robotics
site_description: A hands-on crash course on humanoid robot description, simulation, control, learning, and foundation models.
site_author: asHumanoids
site_url: https://ashumanoids.github.io/2026Spring/
repo_url: https://github.com/asHumanoids/2026Spring
repo_name: asHumanoids/2026Spring

docs_dir: .site-docs
site_dir: _site
use_directory_urls: true

theme:
  name: material
  custom_dir: site-overrides
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Module 01 · Robot Description:
      - Perspectives in Understanding Robots: module-01/robot-perspectives/index.md
      - The Need for Robot Description: module-01/robot-description/index.md
      - MuJoCo for Robots: module-01/mujoco/index.md
  - Module 02 · Simulation & Interaction:
      - Simulation Basics: module-02/simulation-basics/index.md
      - Humanoid Motion Retargeting: module-02/motion-retargeting/index.md
      - Humanoid Simulation: module-02/humanoid-simulation/index.md
      - Humanoid Walking: module-02/humanoid-walking/index.md
      - Whole-Body Control: module-02/whole-body-control/index.md
      - Reinforcement Learning: module-02/reinforcement-learning/index.md
      - Foundation Models: module-02/foundation-models/index.md
  - Module 03 · Selected Topics:
      - Humanoid Movement: module-03/humanoid-movement/index.md
      - Humanoid Contact: module-03/humanoid-contact/index.md
      - Humanoid Control: module-03/humanoid-control/index.md
      - Humanoid Learning: module-03/humanoid-learning/index.md
  - Projects:
      - Final Project Example: projects/final-project-example/index.md
  - Resources:
      - Slide Decks: slides/index.md
      - Jupyter Notebooks: notebooks/index.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

copyright: Copyright &copy; 2026 asHumanoids · Course materials remain linked to their original sources.

validation:
  links:
    not_found: warn
    absolute_links: relative_to_docs
