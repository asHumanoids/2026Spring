name: Deploy Robot Perspectives slides

on:
  push:
    branches:
      - main
    paths:
      - C01_RobotPerspectives/slides.md
      - C01_RobotPerspectives/images/**
      - .github/workflows/robot-perspectives-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build Marp presentation
        run: |
          mkdir -p _site/images _rendered
          npx --yes @marp-team/marp-cli@4.5.0 \
            C01_RobotPerspectives/slides.md \
            --output _site/index.html \
            --html \
            --bespoke.progress
          npx --yes @marp-team/marp-cli@4.5.0 \
            C01_RobotPerspectives/slides.md \
            --output _rendered/slide.png \
            --images png \
            --image-scale 1.5 \
            --allow-local-files
          for index in {1..47}; do
            printf -v rendered "_rendered/slide.%03d.png" "$index"
            target="_site/images/Keynote-Week01-1-Lecture-Perspectives in Understanding Robots-images-$index.png"
            test -f "$rendered"
            cp "$rendered" "$target"
          done
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
